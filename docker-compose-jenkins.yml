version: '3.8'

services:
  # Web Application - Part 2
  web:
    build: .                                    # Build from Dockerfile in repo
    container_name: student-app-jenkins-web     
    ports:
      - "3001:3000"                             
    volumes:
      - ./src:/app/src                          
      - /app/node_modules                       
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root123
      - DB_NAME=student_db
      - DB_PORT=3306
    depends_on:
      - db
    restart: always

  # MySQL Database - Part 2
  db:
    image: mysql:8
    container_name: student-app-jenkins-db      
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: student_db
    ports:
      - "3308:3306"                             
    volumes:
      - db_data_jenkins:/var/lib/mysql          
    restart: always

volumes:
  db_data_jenkins:  # Persistent storage for MySQL data
